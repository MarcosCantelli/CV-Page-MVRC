# Production (OCI VPS, Oracle Linux 9, 512 MB RAM, shared with another application).
#
# mvrc.com.br has its OWN Cloudflare Tunnel, run by the "cloudflared" service below, so it only
# ever reaches this VPS. (Do not route it through a tunnel that has connectors on other machines:
# Cloudflare spreads requests across connectors and the others cannot reach this app -> 502.)
#
# The .env next to this file must contain TUNNEL_TOKEN and COMPOSE_PROFILES=tunnel, so a plain
#   docker compose pull && docker compose up -d
# (what the deploy pipeline runs) also starts the tunnel.
#
# The app is additionally published on 127.0.0.1:4321 for the deploy health check.

name: cv-page-mvrc

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  app:
    <<: *hardening
    image: ${IMAGE:-ghcr.io/marcoscantelli/cv-page-mvrc}:${TAG:-latest}
    env_file: .env
    environment:
      PORT: '4321'
      # Measured ~55 MB RSS; keep the footprint small on the 512 MB VM.
      NODE_OPTIONS: '--max-old-space-size=64'
    tmpfs:
      - /tmp
    ports:
      - '127.0.0.1:${CV_HOST_PORT:-4321}:4321'
    mem_limit: 128m
    cpus: 0.5
    networks: [web]

  cloudflared:
    <<: *hardening
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.10.0
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 96m
    networks: [web]

networks:
  web: {}
