name: Container

# DEV  -> image :dev (BASE_PATH=/cv)  -> on-prem dev server (self-hosted runner)
# main -> image :latest, sha-<commit>  -> approval issue -> "/approve" -> deploy-production.yml
# v*   -> image :<version>            (no deploy)

on:
  push:
    branches: [main, DEV]
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/marcoscantelli/cv-page-mvrc

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.cfg.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Environment settings
        id: cfg
        env:
          PROD_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/DEV" ]; then
            {
              echo "site_url=http://dev.mvrc.local"
              echo "base_path=/cv"
              echo "site_key=1x00000000000000000000AA"
              echo "sha_prefix=dev-sha-"
              echo "sha_tag=dev-sha-${GITHUB_SHA}"
              echo "cache=dev"
            } >> "$GITHUB_OUTPUT"
          else
            if [ -z "$PROD_SITE_KEY" ]; then
              echo "::error::Repository variable TURNSTILE_SITE_KEY is not set (see docs/SETUP.md)"
              exit 1
            fi
            {
              echo "site_url=https://mvrc.com.br"
              echo "base_path=/"
              echo "site_key=${PROD_SITE_KEY}"
              echo "sha_prefix=sha-"
              echo "sha_tag=sha-${GITHUB_SHA}"
              echo "cache=prod"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/DEV' }}
            type=sha,format=long,prefix=${{ steps.cfg.outputs.sha_prefix }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SITE_URL=${{ steps.cfg.outputs.site_url }}
            BASE_PATH=${{ steps.cfg.outputs.base_path }}
            PUBLIC_TURNSTILE_SITE_KEY=${{ steps.cfg.outputs.site_key }}
          cache-from: type=gha,scope=${{ steps.cfg.outputs.cache }}
          cache-to: type=gha,mode=max,scope=${{ steps.cfg.outputs.cache }}

  deploy-dev:
    name: Deploy to dev server
    if: github.ref == 'refs/heads/DEV'
    needs: build
    # Self-hosted runner on the on-prem dev server (label cv-dev). See docs/SETUP.md.
    runs-on: [self-hosted, linux, cv-dev]
    timeout-minutes: 10
    environment:
      name: dev
      url: http://dev.mvrc.local/cv/
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: /opt/cv-page-mvrc-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: deploy
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy
        run: |
          install -m 0644 deploy/dev/docker-compose.yml "$DEPLOY_DIR/docker-compose.yml"
          port="$(grep -E '^CV_HOST_PORT=' "$DEPLOY_DIR/.env" | cut -d= -f2 || true)"
          bash deploy/scripts/deploy.sh "$DEPLOY_DIR" "${{ needs.build.outputs.tag }}" \
            "http://127.0.0.1:${port:-4321}/cv/"

  # Approval gate for production (works on a private repo on the Free plan, where environment
  # reviewers are not available). Opens an issue and stops; commenting "/approve" on it as the
  # repository owner triggers deploy-production.yml. No minutes are spent while waiting.
  request-approval:
    name: Request production approval
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.build.outputs.tag }}
      API: ${{ github.api_url }}/repos/${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open approval issue
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }

          # Label used to find approval issues (ignore "already exists").
          api -X POST "$API/labels" -d '{"name":"deploy-approval","color":"1F4E79"}' >/dev/null 2>&1 || true

          # Close older pending approvals: only the newest build can be approved.
          for n in $(api "$API/issues?state=open&labels=deploy-approval&per_page=50" | jq -r '.[].number'); do
            api -X POST "$API/issues/$n/comments" -d "$(jq -n --arg t "$TAG" '{body: ("Substituída por um build mais novo (" + $t + ").")}')" >/dev/null
            api -X PATCH "$API/issues/$n" -d '{"state":"closed","state_reason":"not_planned"}' >/dev/null
          done

          body=$(jq -n --arg tag "$TAG" --arg run "$RUN_URL" --arg sha "$GITHUB_SHA" '{
            title: ("Deploy production: " + $tag),
            labels: ["deploy-approval"],
            body: ("A imagem `ghcr.io/marcoscantelli/cv-page-mvrc:" + $tag + "` está pronta.\n\n" +
                   "- Commit: " + $sha + "\n- Build: " + $run + "\n\n" +
                   "Comente **`/approve`** para publicar em https://mvrc.com.br ou **`/reject`** para descartar.")
          }')
          url=$(api -X POST "$API/issues" -d "$body" | jq -r .html_url)
          echo "### Aguardando aprovação: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Approval issue: $url"
