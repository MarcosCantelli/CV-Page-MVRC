name: Container

# DEV  -> image :dev (BASE_PATH=/cv)  -> on-prem dev server (self-hosted runner)
# main -> image :latest               -> OCI VPS (SSH)
# v*   -> image :<version>            (no deploy)

on:
  push:
    branches: [main, DEV]
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/marcoscantelli/cv-page-mvrc

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.cfg.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Environment settings
        id: cfg
        env:
          PROD_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/DEV" ]; then
            {
              echo "site_url=http://dev.mvrc.local"
              echo "base_path=/cv"
              echo "site_key=1x00000000000000000000AA"
              echo "sha_prefix=dev-sha-"
              echo "sha_tag=dev-sha-${GITHUB_SHA}"
              echo "cache=dev"
            } >> "$GITHUB_OUTPUT"
          else
            if [ -z "$PROD_SITE_KEY" ]; then
              echo "::error::Repository variable TURNSTILE_SITE_KEY is not set (see docs/SETUP.md)"
              exit 1
            fi
            {
              echo "site_url=https://mvrc.com.br"
              echo "base_path=/"
              echo "site_key=${PROD_SITE_KEY}"
              echo "sha_prefix=sha-"
              echo "sha_tag=sha-${GITHUB_SHA}"
              echo "cache=prod"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/DEV' }}
            type=sha,format=long,prefix=${{ steps.cfg.outputs.sha_prefix }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SITE_URL=${{ steps.cfg.outputs.site_url }}
            BASE_PATH=${{ steps.cfg.outputs.base_path }}
            PUBLIC_TURNSTILE_SITE_KEY=${{ steps.cfg.outputs.site_key }}
          cache-from: type=gha,scope=${{ steps.cfg.outputs.cache }}
          cache-to: type=gha,mode=max,scope=${{ steps.cfg.outputs.cache }}

  deploy-dev:
    name: Deploy to dev server
    if: github.ref == 'refs/heads/DEV'
    needs: build
    # Self-hosted runner on the on-prem dev server (label cv-dev). See docs/SETUP.md.
    runs-on: [self-hosted, linux, cv-dev]
    timeout-minutes: 10
    environment:
      name: dev
      url: http://dev.mvrc.local/cv/
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: /opt/cv-page-mvrc-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: deploy
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy
        run: |
          install -m 0644 deploy/dev/docker-compose.yml "$DEPLOY_DIR/docker-compose.yml"
          port="$(grep -E '^CV_HOST_PORT=' "$DEPLOY_DIR/.env" | cut -d= -f2 || true)"
          bash deploy/scripts/deploy.sh "$DEPLOY_DIR" "${{ needs.build.outputs.tag }}" \
            "http://127.0.0.1:${port:-4321}/cv/"

  deploy-prod:
    name: Deploy to production
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://mvrc.com.br
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            docker-compose.yml
            deploy/scripts
          sparse-checkout-cone-mode: false
      - name: Require SSH host key pinning
        env:
          FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          if [ -z "$FINGERPRINT" ]; then
            echo "::error::Secret VPS_HOST_FINGERPRINT is not set (see docs/SETUP.md, etapa 7)"
            exit 1
          fi
      - name: Copy compose file and deploy script
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          source: docker-compose.yml,deploy/scripts/deploy.sh
          target: /opt/cv-page-mvrc
      - name: Pull and restart
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          script: bash /opt/cv-page-mvrc/deploy/scripts/deploy.sh /opt/cv-page-mvrc "${{ needs.build.outputs.tag }}"
      - name: Public health check
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors https://mvrc.com.br/healthz
