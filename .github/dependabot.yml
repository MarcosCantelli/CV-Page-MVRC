version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: DEV
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    target-branch: DEV
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directories: ['/', '/deploy/dev', '/deploy/caddy']
    target-branch: DEV
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    target-branch: DEV
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
